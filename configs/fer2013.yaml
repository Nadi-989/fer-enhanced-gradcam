# FER2013 - six basic emotions (neutral folder is ignored)
data_root: data/fer2013          # Kaggle folder release (train/, test/) or output of scripts/prepare_fer2013.py
classes: [angry, disgust, fear, happy, sad, surprise]
img_size: 112                    # 48x48 faces upsampled; deep ResNet map is then 4x4
arch: resnet18                   # resnet18 | resnet50 | vgg16 | efficientnet_b0 | simplecnn
pretrained: true                 # ImageNet weights
epochs: 40
batch_size: 128
lr: 0.0005
weight_decay: 0.0001
label_smoothing: 0.1
class_weights: true              # FER2013 'disgust' is very small
patience: 8
val_split: 0.1                   # used only if there is no val/ folder
seed: 42
num_workers: 2

# CAM evaluation
cam_methods: [gradcam, gradcam++, xgradcam, layercam, scorecam, eigencam, gradcam_tta, msf_notta, msf]
cam_max_images: 1200             # stratified subsample of the test set; null = all
