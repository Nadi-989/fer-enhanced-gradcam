# Synthetic smoke test: python scripts/make_dummy_data.py first
data_root: data/dummy
classes: [angry, disgust, fear, happy, sad, surprise]
img_size: 64
arch: simplecnn
pretrained: false
epochs: 8
batch_size: 32
lr: 0.002
weight_decay: 0.0001
label_smoothing: 0.0
class_weights: true
patience: 20
val_split: 0.15
seed: 0
num_workers: 0
cam_methods: [gradcam, gradcam++, layercam, scorecam, gradcam_tta, msf_notta, msf]
cam_max_images: 30
